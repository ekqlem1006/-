<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#12151b">
<title>설교 프롬프터</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header id="top">
    <div class="who">
      <span id="connDot" class="dot off" title="연결 상태"></span>
      <div class="who-text">
        <b id="hostName">연결 중…</b>
        <span id="pptName"></span>
      </div>
    </div>
    <div id="liveChip" class="chip">–</div>
    <nav id="tabs">
      <button data-tab="prep">준비</button>
      <button data-tab="preach">설교</button>
    </nav>
  </header>

  <div id="connBanner" class="banner bad" hidden>
    <span>컴퓨터와 연결이 끊겼습니다. 다시 연결하는 중…</span>
    <button id="btnReconnect">지금 다시 연결</button>
  </div>

  <main id="prep" hidden>
    <section class="card">
      <h2><span class="step">1</span> 대본 넣기</h2>
      <p class="help">설교 대본 전체를 붙여 넣으세요. <code>▶ 1 · 제목</code> 표시가 있는 줄마다 슬라이드 구간으로 자동으로 나뉩니다.</p>
      <textarea id="script" spellcheck="false" placeholder="▶ 1 · 표지 &quot;와서 보라&quot;&#10;첫 인사와 도입&#10;&#10;▶ 2 · 요한복음 1:43-46&#10;성경 본문과 설명"></textarea>
      <div class="row">
        <button id="btnParse" class="primary">슬라이드별로 자동 나누기</button>
        <span id="parseInfo" class="muted"></span>
      </div>
    </section>

    <section class="card">
      <h2><span class="step">2</span> 예배 PPT 와 연결</h2>
      <div id="pptInfo" class="pptinfo"></div>
      <div class="row">
        <button id="btnSeq" class="primary">시작 슬라이드 지정 (순서대로 연결)</button>
        <button id="btnRefresh">PPT 다시 읽기</button>
      </div>
      <div id="mapSummary" class="muted"></div>
    </section>

    <section id="secList"></section>

    <section class="card">
      <h2>저장</h2>
      <p class="help">대본과 연결 정보는 예배용 컴퓨터에 자동으로 저장됩니다. 같은 PPT 를 다시 열면 그대로 불러옵니다.</p>
      <div class="row">
        <span id="saveState" class="muted">–</span>
        <button id="btnLoadOther">다른 저장본 불러오기</button>
        <button id="btnNew">이 PPT 의 준비 내용 지우기</button>
      </div>
    </section>
  </main>

  <main id="preach" hidden>
    <div id="modeBar" class="modebar"></div>
    <div id="preachEmpty" class="empty" hidden>
      <p>아직 준비된 대본이 없습니다.</p>
      <button class="primary" data-goto-prep>준비 화면으로 가기</button>
    </div>
    <div class="panes" id="panes">
      <div id="scriptPane"></div>
      <div id="slidePane"></div>
    </div>
    <footer id="bar">
      <button id="btnControl" class="ctl">설교 조작 시작</button>
      <button id="btnPrev" class="nav">◀ 이전</button>
      <button id="btnNext" class="nav next">다음 ▶</button>
      <button id="btnBlack" class="blk">검은 화면</button>
      <div class="font">
        <button id="btnFontDn" aria-label="글씨 작게">가<small>−</small></button>
        <button id="btnFontUp" aria-label="글씨 크게">가<small>＋</small></button>
      </div>
    </footer>
  </main>

  <main id="badKey" hidden>
    <div class="empty">
      <h2>연결할 수 없습니다</h2>
      <p>예배용 컴퓨터 화면에 있는 QR 코드를 태블릿 카메라로 다시 찍어 주세요.</p>
    </div>
  </main>
</div>

<div id="modal" hidden></div>
<div id="toast" hidden></div>

<script src="logic.js"></script>
<script src="app.js"></script>
</body>
</html>
